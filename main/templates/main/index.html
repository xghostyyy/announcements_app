<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
        {% if user_token %}
            <div>
                <p><strong>Ваш токен авторизации:</strong></p>
                <code>{{ user_token }}</code>
                
                <p><strong>Готовый заголовок для Postman / HTTP:</strong></p>
                <code>Authorization: Token {{ user_token }}</code>
            </div>
        {% endif %}
    </body>
</html>
